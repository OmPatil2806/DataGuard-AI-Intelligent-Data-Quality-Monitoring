# Fault injection and detection evaluation (Phase 6).
#
# Every experiment breaks a copy of one clean month (target_month) in one known way, runs the
# whole pipeline on it after a clean history, and compares the findings with what was broken.
# A control experiment runs the same month unbroken, so findings the month raises on its own
# are never counted as detections. Experiments run in their own folders under `workspace`
# (data/ is ignored by Git); the real pipeline's database and files are never touched.

dataset: yellow_taxi
target_month: "2023-06"
history: {start: "2023-01", end: "2023-05"}   # gives the target month a trusted baseline

# Share of each month's rows used, the same rows in every experiment (1.0 = every row).
# 0.1 keeps 30+ experiments on the full data to minutes instead of hours.
sample_fraction: 0.1
seed: 42                    # same sample, same broken rows, every time
workspace: data/evaluation

# Default strengths by kind: share of the rows broken, or days a file is late.
strengths:
  share: [0.01, 0.05, 0.20]
  days: [1, 5, 20]

# kind:            share | days | none (one experiment, no strength)
# extra_strengths: added where every default strength is below a check's deliberate limit,
#                  so the evaluation also shows the check catching its fault
# expect:          detectors that should fire: a row rule id, a dataset check (schema, volume,
#                  freshness, null_rate, drift; column for per-column checks), or ml: anomaly
#                  (the anomaly model of Phase 7)
# explain:         the explanation that counts as right (Phase 8, explanation_accuracy.py):
#                  causes = playbook cause ids (configs/playbooks.yml); where = none (a fault
#                  spread at random: no where/when may be claimed) or {dimension, value} (the
#                  segment that must be named); left out where the place is not judged
faults:
  missing_column:
    category: schema
    kind: none
    description: "A required column is not delivered"
    params: {column: passenger_count}
    expect: [{check: schema}]
    explain: {causes: [column_missing]}

  null_spike:
    category: completeness
    kind: share
    description: "fare_amount is empty in a share of rows"
    params: {column: fare_amount}
    expect: [{check: null_rate, column: fare_amount}]
    explain: {causes: [source_nulls], where: none}

  null_spike_vendor:
    category: completeness
    kind: share
    description: "fare_amount is empty in a share of one vendor's rows"
    params: {column: fare_amount, segment_column: VendorID, segment_value: 2}
    expect: [{check: null_rate, column: fare_amount}]
    explain: {causes: [segment_sends_nulls], where: {dimension: vendor, value: "2"}}

  duplicate_rows:
    category: uniqueness
    kind: share
    description: "A share of rows is delivered twice"
    params: {}
    expect: [{rule: trip_unique}]
    explain: {causes: [duplicate_delivery], where: none}

  out_of_range:
    category: validity
    kind: share
    description: "fare_amount is negative in a share of rows"
    params: {column: fare_amount}
    expect: [{rule: fare_not_negative}]
    explain: {causes: [out_of_range_values], where: none}

  orphan_location:
    category: referential
    kind: share
    description: "PULocationID points to a zone that does not exist"
    params: {column: PULocationID, value: 999}
    expect: [{rule: pickup_zone_known}]
    explain: {causes: [unknown_location], where: none}

  unit_change:
    category: drift
    kind: share
    extra_strengths: [1.0]
    description: "trip_distance delivered in kilometres instead of miles for a share of rows"
    params: {column: trip_distance, factor: 1.609344}
    expect: [{check: drift, column: trip_distance}]
    explain: {causes: [unit_change]}

  volume_drop:
    category: volume
    kind: share
    extra_strengths: [0.5]
    description: "A share of the month's rows is missing"
    params: {}
    expect: [{check: volume}]
    explain: {causes: [rows_missing_evenly]}

  stale_file:
    category: freshness
    kind: days
    description: "The file arrives late"
    params: {}
    expect: [{check: freshness}]
    explain: {causes: [late_delivery]}

  pickup_outside_month:
    category: pattern
    kind: share
    description: "Pickup times moved to the previous month for a share of rows"
    params: {}
    expect: [{rule: pickup_in_file_month}]
    # the moved trips sit on other dates by design, so the place is not judged
    explain: {causes: [trips_from_other_months]}

  swapped_times:
    category: consistency
    kind: share
    description: "Pickup and dropoff times swapped for a share of rows"
    params: {}
    expect: [{rule: dropoff_not_before_pickup}]
    explain: {causes: [times_swapped], where: none}

  plausible_but_wrong:
    category: ml_anomaly
    kind: share
    description: "Fares tripled on short trips, total raised to match: every value in range"
    params: {factor: 3, max_distance: 3.0}
    expect: [{ml: anomaly}]
    # short trips only, which can gather in some zones: the place is not judged
    explain: {causes: [fare_does_not_fit_trip]}
