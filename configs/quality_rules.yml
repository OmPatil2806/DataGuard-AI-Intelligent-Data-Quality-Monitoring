# Quality rules and dataset-level check settings.
# Row-level rules per dataset are added in Phase 2; dataset-level checks are tuned in Phase 3.

version: 1

defaults:
  baseline:
    min_runs: 3              # earlier months needed before a baseline is trusted
    window: 6                # at most this many earlier months form the baseline
    max_gap_months: 12       # earlier months further back than this are ignored
  volume:
    tolerance: 0.30          # allowed deviation of rows per day from the rolling median
  null_rate:
    # Increase of the NULL share over the baseline median, in absolute terms (0.02 = 2 points).
    # Open item O2 decided for absolute: a relative limit over-reacts on columns that are almost
    # never empty. Beyond the limit: low up to 2x, medium up to 5x, high above.
    max_increase: 0.02
    # Columns that are normally complete (baseline below 0.1%) get a much tighter limit, so a
    # 1% NULL spike in, say, fare_amount is not hidden by the 2-point limit.
    complete_below: 0.001
    max_increase_complete: 0.001
  drift:
    psi_medium: 0.10
    psi_high: 0.20
    # Fixed bin edges per column (standard schema). Every month is binned the same way, so
    # months can be compared. Values below the first edge and above the last edge fall into
    # two open-ended bins, which keeps extreme values from distorting the comparison.
    bins:
      trip_distance: [0, 0.5, 1, 1.5, 2, 3, 4, 5, 7, 10, 15, 20, 30, 50]
      fare_amount: [0, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 40, 50, 70, 100]
      total_amount: [0, 10, 15, 20, 25, 30, 40, 50, 70, 100, 150]
  freshness:
    # replay: historical files were downloaded long after they were published, so a file
    #         counts as delivered on time unless file_manifest.simulated_delivered_at says
    #         otherwise (set for tests and the stale-file fault).
    # live:   the real arrival time (file_manifest.delivered_at) is used.
    mode: replay
    grace_days: 3              # arriving up to this many days after expected_at is on time
  incidents:
    resolve_after_clean_runs: 2

# Fixed limits per dataset, used while a month has no trusted baseline yet (cold start).
cold_start:
  yellow_taxi:
    # Expected range for current operation (2023: 91k-114k). 2019-01 (248k) lies above it on
    # purpose: its volume difference is reported even though it has no earlier month.
    rows_per_day: {min: 50000, max: 200000}
    null_rate_max: 0.10                       # profiled: at most 5.33% per column

# Row-level rules per dataset. Columns use the standard schema (configs/datasets.yml).
# Every rule has:
#   id         unique snake_case name, e.g. fare_not_negative
#   category   completeness | uniqueness | validity | pattern | referential | consistency
#   check      one of the check types below, with its parameters
#   action     quarantine (row leaves Silver) | warn (row stays, flagged)
#   severity   critical | high | medium | low
#   reason     text stored with every failing row; {column} style placeholders allowed
#   when       optional SQL condition: the rule only applies to rows where it is true
#   enabled    optional, default true
#
# Check types (a row FAILS when the condition below is not met; NULL values pass every
# check except not_null, so missing values are reported once, by completeness rules):
#   not_null        columns: [..], mode: any | all   any: fail if any is NULL; all: if all are
#   range           column, min and/or max, exclusive_min / exclusive_max (default false)
#   allowed_values  column, values: [..]   the value must be one of these
#   forbidden_values column, values: [..]  the value must not be one of these
#   compare         left, op (< <= > >= = !=), right (both columns)
#   duration        start, end (timestamps), min_seconds and/or max_seconds
#   within_period   column (timestamp): must fall inside the file's month
#   foreign_key     column, lookup (from datasets.yml lookups), lookup_column
#   unique          columns: [..]; every row after the first with the same values fails
#   sum_equals      total, parts: [..], tolerance; alternatives: [[..], ..] other accepted parts
#
# Example:
#   - id: fare_not_negative
#     category: validity
#     check: range
#     column: fare_amount
#     min: 0
#     action: quarantine
#     severity: high
#     reason: "fare_amount {fare_amount} below 0 (refund or dispute)"
rules:
  # NYC Yellow Taxi. Actions and thresholds come from docs/data_profile.md (Phase 0); the
  # percentages in comments are the worst month measured there.
  yellow_taxi:
    # --- completeness --------------------------------------------------------------------
    - id: trip_metadata_missing        # 0.37% - 5.33% of rows, always all five together
      description: "Rows where the meter sent no trip metadata. Fares and zones are present, so the trip is real; one warning instead of five per-column failures."
      category: completeness
      check: not_null
      columns: [passenger_count, RatecodeID, store_and_fwd_flag, congestion_surcharge, airport_fee]
      mode: all
      action: warn
      severity: low
      reason: "trip metadata missing (passenger_count, RatecodeID, store_and_fwd_flag, surcharges)"

    - id: trip_times_present
      description: "Every later check and every Gold metric needs both timestamps."
      category: completeness
      check: not_null
      columns: [tpep_pickup_datetime, tpep_dropoff_datetime]
      action: quarantine
      severity: high
      reason: "pickup or dropoff time missing"

    # --- validity ------------------------------------------------------------------------
    - id: fare_not_negative            # 1.26%: refunds and disputes
      description: "Negative fares are refunds and disputes: valid business records, but not trips."
      category: validity
      check: range
      column: fare_amount
      min: 0
      action: quarantine
      severity: high
      reason: "fare_amount {fare_amount} below 0 (refund or dispute, payment_type {payment_type})"

    - id: total_not_negative           # 1.18%
      description: "Negative totals belong to the same refunds; checked separately in case the fare is positive."
      category: validity
      check: range
      column: total_amount
      min: 0
      action: quarantine
      severity: high
      reason: "total_amount {total_amount} below 0"

    - id: fare_not_zero                # 0.04%
      description: "A zero fare with a trip is unusual but can be a no-charge trip (payment_type 3)."
      category: validity
      check: forbidden_values
      column: fare_amount
      values: [0]
      action: warn
      severity: low
      reason: "fare_amount is 0"

    - id: distance_not_negative
      description: "A negative distance is physically impossible."
      category: validity
      check: range
      column: trip_distance
      min: 0
      action: quarantine
      severity: high
      reason: "trip_distance {trip_distance} below 0"

    - id: distance_not_zero            # 3.46%: cancelled or flat-rate trips
      description: "Often cancelled or flat-rate trips; kept in Silver but counted."
      category: validity
      check: forbidden_values
      column: trip_distance
      values: [0]
      action: warn
      severity: low
      reason: "trip_distance is 0"

    - id: distance_max_100_miles       # 0.005%; real maximum 345,729 miles
      description: "Extremes up to 345,729 miles exist; above 100 miles a city taxi trip is not plausible."
      category: validity
      check: range
      column: trip_distance
      max: 100
      action: quarantine
      severity: medium
      reason: "trip_distance {trip_distance} above 100 miles"

    - id: passengers_not_zero          # 1.73%: driver-entered field
      description: "Driver-entered field; zero usually means it was not filled in."
      category: validity
      check: forbidden_values
      column: passenger_count
      values: [0]
      action: warn
      severity: low
      reason: "passenger_count is 0"

    - id: passengers_max_6             # 0.002%
      description: "More than six passengers do not fit in a yellow taxi; the value is likely a typing error."
      category: validity
      check: range
      column: passenger_count
      max: 6
      action: quarantine
      severity: medium
      reason: "passenger_count {passenger_count} above 6"

    # --- pattern and timestamp -----------------------------------------------------------
    - id: pickup_in_file_month         # 0.007%
      description: "Each monthly file should hold that month's trips; others signal a wrong or mixed delivery."
      category: pattern
      check: within_period
      column: tpep_pickup_datetime
      action: quarantine
      severity: high
      reason: "pickup {tpep_pickup_datetime} outside the file's month"

    # --- consistency ---------------------------------------------------------------------
    - id: dropoff_not_before_pickup    # 0.027%
      description: "A trip cannot end before it starts."
      category: consistency
      check: compare
      left: tpep_dropoff_datetime
      op: ">="
      right: tpep_pickup_datetime
      action: quarantine
      severity: high
      reason: "dropoff {tpep_dropoff_datetime} earlier than pickup {tpep_pickup_datetime}"

    - id: trip_has_duration            # 0.085%
      description: "Dropoff equal to pickup usually means a test or cancelled meter start."
      category: consistency
      check: compare
      left: tpep_dropoff_datetime
      op: "!="
      right: tpep_pickup_datetime
      action: warn
      severity: low
      reason: "dropoff equals pickup ({tpep_pickup_datetime})"

    - id: trip_under_24_hours          # 0.001%
      description: "A taxi trip longer than a day is a meter or clock error."
      category: consistency
      check: duration
      start: tpep_pickup_datetime
      end: tpep_dropoff_datetime
      max_seconds: 86400
      action: quarantine
      severity: medium
      reason: "trip longer than 24 hours ({tpep_pickup_datetime} to {tpep_dropoff_datetime})"

    # PENDING open item O1 (docs/data_profile.md): disabled until diagnose_totals.py has been
    # run on the full data. Current definition: total equals all parts, or (VendorID 1 finding)
    # all parts except congestion_surcharge and airport_fee, which that vendor books in extra.
    - id: total_matches_parts
      description: "The charged total should equal its components. Pending open item O1: the formula is being confirmed on the full data."
      enabled: false
      category: consistency
      check: sum_equals
      total: total_amount
      parts: [fare_amount, extra, mta_tax, tip_amount, tolls_amount, improvement_surcharge,
              congestion_surcharge, airport_fee]
      alternatives:
        - [fare_amount, extra, mta_tax, tip_amount, tolls_amount, improvement_surcharge]
      tolerance: 0.01
      action: quarantine
      severity: medium
      reason: "total_amount {total_amount} does not match the sum of its parts"

    # --- referential ---------------------------------------------------------------------
    - id: pickup_zone_known            # 0 rows in real data; tested by fault injection
      description: "Every pickup zone must exist in the zone lookup (referential integrity)."
      category: referential
      check: foreign_key
      column: PULocationID
      lookup: taxi_zone
      lookup_column: LocationID
      action: quarantine
      severity: high
      reason: "PULocationID {PULocationID} not in zone lookup"

    - id: dropoff_zone_known
      description: "Every dropoff zone must exist in the zone lookup (referential integrity)."
      category: referential
      check: foreign_key
      column: DOLocationID
      lookup: taxi_zone
      lookup_column: LocationID
      action: quarantine
      severity: high
      reason: "DOLocationID {DOLocationID} not in zone lookup"

    - id: pickup_zone_not_unknown      # zones 264/265 together: 2.44%
      description: "Zones 264/265 are valid IDs without a real location (Unknown / Outside of NYC)."
      category: referential
      check: forbidden_values
      column: PULocationID
      values: [264, 265]
      action: warn
      severity: low
      reason: "PULocationID {PULocationID} is Unknown / Outside of NYC"

    - id: dropoff_zone_not_unknown
      description: "Zones 264/265 are valid IDs without a real location (Unknown / Outside of NYC)."
      category: referential
      check: forbidden_values
      column: DOLocationID
      values: [264, 265]
      action: warn
      severity: low
      reason: "DOLocationID {DOLocationID} is Unknown / Outside of NYC"

    # --- uniqueness ----------------------------------------------------------------------
    - id: trip_unique                  # at most 3 per file; tested by fault injection
      description: "The same trip delivered twice would be counted twice in every metric."
      category: uniqueness
      check: unique
      columns: [VendorID, tpep_pickup_datetime, tpep_dropoff_datetime, PULocationID,
                DOLocationID, fare_amount, total_amount]
      action: quarantine
      severity: medium
      reason: "duplicate of an earlier trip (same vendor, times, zones, fare and total)"
