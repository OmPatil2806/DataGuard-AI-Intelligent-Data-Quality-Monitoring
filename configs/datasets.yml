# Datasets monitored by DataGuard AI and where their files live.
# Paths are relative to the repository root.

paths:
  data_dir: data
  incoming: data/incoming
  sample: data/sample
  bronze: data/bronze
  silver: data/silver
  quarantine: data/quarantine
  duckdb: data/dataguard.duckdb

datasets:
  yellow_taxi:
    description: NYC TLC Yellow Taxi trip records (monthly Parquet files)
    enabled: true
    format: parquet
    frequency: monthly
    url_template: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{period}.parquet
    file_template: yellow_tripdata_{period}.parquet
    timestamp_column: tpep_pickup_datetime
    # A month's file is expected this many days after the month ends (freshness check).
    # TLC publishes with a delay of roughly two months; calibrated in Phase 3.
    expected_lag_days: 60
    periods:
      start: "2023-01"
      end: "2023-12"
      # Older month for a real schema difference; confirmed during profiling (Step 0.7).
      extra: ["2019-01"]
    # Standard schema after standardization (Phase 2). Source columns are matched by name
    # ignoring case, renamed to these names and cast to these types. Bronze keeps the raw schema.
    columns:
      VendorID: INTEGER
      tpep_pickup_datetime: TIMESTAMP
      tpep_dropoff_datetime: TIMESTAMP
      passenger_count: INTEGER
      trip_distance: DOUBLE
      RatecodeID: INTEGER
      store_and_fwd_flag: VARCHAR
      PULocationID: INTEGER
      DOLocationID: INTEGER
      payment_type: INTEGER
      fare_amount: DOUBLE
      extra: DOUBLE
      mta_tax: DOUBLE
      tip_amount: DOUBLE
      tolls_amount: DOUBLE
      improvement_surcharge: DOUBLE
      total_amount: DOUBLE
      congestion_surcharge: DOUBLE
      airport_fee: DOUBLE
    lookups:
      taxi_zone:
        url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
        file: taxi_zone_lookup.csv

  ved_signals:
    description: Vehicle Energy Dataset, OBD-II signals from 383 cars (added in Phase 9)
    enabled: false
    format: csv
    frequency: weekly
