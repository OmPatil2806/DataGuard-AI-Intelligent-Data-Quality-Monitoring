# Datasets monitored by DataGuard AI and where their files live.
# Paths are relative to the repository root.

paths:
  data_dir: data
  incoming: data/incoming
  sample: data/sample
  bronze: data/bronze
  silver: data/silver
  quarantine: data/quarantine
  duckdb: data/dataguard.duckdb
  reports: data/reports

datasets:
  yellow_taxi:
    description: NYC TLC Yellow Taxi trip records (monthly Parquet files)
    enabled: true
    format: parquet
    frequency: monthly
    url_template: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{period}.parquet
    file_template: yellow_tripdata_{period}.parquet
    timestamp_column: tpep_pickup_datetime
    # A month's file is expected this many days after the month ends (freshness check).
    # TLC publishes with a delay of roughly two months; calibrated in Phase 3.
    expected_lag_days: 60
    periods:
      start: "2023-01"
      end: "2023-12"
      # Older month for a real schema difference; confirmed during profiling (Step 0.7).
      extra: ["2019-01"]
    # Standard schema after standardization (Phase 2). Source columns are matched by name
    # ignoring case, renamed to these names and cast to these types. Bronze keeps the raw schema.
    columns:
      VendorID: INTEGER
      tpep_pickup_datetime: TIMESTAMP
      tpep_dropoff_datetime: TIMESTAMP
      passenger_count: INTEGER
      trip_distance: DOUBLE
      RatecodeID: INTEGER
      store_and_fwd_flag: VARCHAR
      PULocationID: INTEGER
      DOLocationID: INTEGER
      payment_type: INTEGER
      fare_amount: DOUBLE
      extra: DOUBLE
      mta_tax: DOUBLE
      tip_amount: DOUBLE
      tolls_amount: DOUBLE
      improvement_surcharge: DOUBLE
      total_amount: DOUBLE
      congestion_surcharge: DOUBLE
      airport_fee: DOUBLE
    lookups:
      taxi_zone:
        url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
        file: taxi_zone_lookup.csv
    # Columns added to Silver and Quarantine (Phase 4). derived: SQL over the standard columns.
    # joins: columns copied from a lookup where key = column; rows without a match get NULL.
    # (The key is called `column`, not `on`: YAML reads a bare `on` as the boolean true.)
    silver:
      derived:
        trip_duration_min: "(epoch(tpep_dropoff_datetime) - epoch(tpep_pickup_datetime)) / 60.0"
        pickup_date: "CAST(tpep_pickup_datetime AS DATE)"
        pickup_hour: "hour(tpep_pickup_datetime)"
      joins:
        - lookup: taxi_zone
          key: LocationID
          column: PULocationID
          columns: {Borough: pickup_borough, Zone: pickup_zone}
        - lookup: taxi_zone
          key: LocationID
          column: DOLocationID
          columns: {Borough: dropoff_borough, Zone: dropoff_zone}

  ved_signals:
    # Vehicle Energy Dataset (Oh, LeBlanc, Peng, IEEE T-ITS 2020; Apache License 2.0):
    # https://github.com/gsoh/VED. Profiled in Phase 9.1 (docs/ved_profile.md); monitored from
    # Phase 9.5. Weekly CSVs inside two 7z archives, plus the vehicles' static data in Excel.
    description: Vehicle Energy Dataset, OBD-II signals from 384 cars in Ann Arbor (Phase 9)
    enabled: false
    # The source is weekly CSVs; ingest_data.py first regroups their rows into one Parquet file
    # per month (src/ingestion/prepare_source.py), which is what is registered and loaded.
    format: parquet
    frequency: monthly
    file_template: ved_signals_{period}.parquet
    # 2018-11 has only 10 days (docs/ved_profile.md, V20): left out
    periods:
      start: "2017-11"
      end: "2018-10"
    source:
      kind: csv_files
      files: "VED_*_week.csv"
      url: https://github.com/gsoh/VED
      # the files write missing values as NaN (V3); every file's rows are checked against its
      # lines, as DuckDB's CSV reader skips rows of these files without an error (V1)
      null_values: ["NaN"]
      # a row's month: DayNum is the trip's start in days (1.0 = 2017-11-01 00:00) and
      # Timestamp(ms) the time since the trip started (V5)
      period_sql: >-
        strftime(TIMESTAMP '2017-11-01' + to_microseconds(CAST(round((DayNum - 1) * 86400e6
        + "Timestamp(ms)" * 1000) AS BIGINT)), '%Y-%m')
    # The row time is computed (V5), not delivered: no freshness either, as VED is a closed,
    # historical dataset without a delivery schedule (no expected_lag_days: the check skips).
    timestamp_column: row_time
    # Standard schema (Phase 9.3): snake_case names with the unit, mapped from the source
    # names, which carry units in brackets (V4). OAT also accepts the README's longer name.
    columns:
      day_num: {type: DOUBLE, source: DayNum}
      vehicle_id: {type: INTEGER, source: VehId}
      trip_id: {type: INTEGER, source: Trip}
      trip_ms: {type: BIGINT, source: "Timestamp(ms)"}
      latitude: {type: DOUBLE, source: "Latitude[deg]"}
      longitude: {type: DOUBLE, source: "Longitude[deg]"}
      speed_kmh: {type: DOUBLE, source: "Vehicle Speed[km/h]"}
      maf_g_s: {type: DOUBLE, source: "MAF[g/sec]"}
      engine_rpm: {type: DOUBLE, source: "Engine RPM[RPM]"}
      absolute_load_pct: {type: DOUBLE, source: "Absolute Load[%]"}
      outside_temp_c: {type: DOUBLE, source: ["OAT[DegC]", "Outside Air Temperature[DegC]"]}
      fuel_rate_l_h: {type: DOUBLE, source: "Fuel Rate[L/hr]"}
      ac_power_kw: {type: DOUBLE, source: "Air Conditioning Power[kW]"}
      ac_power_w: {type: DOUBLE, source: "Air Conditioning Power[Watts]"}
      heater_power_w: {type: DOUBLE, source: "Heater Power[Watts]"}
      battery_current_a: {type: DOUBLE, source: "HV Battery Current[A]"}
      battery_soc_pct: {type: DOUBLE, source: "HV Battery SOC[%]"}
      battery_voltage_v: {type: DOUBLE, source: "HV Battery Voltage[V]"}
      stft_bank1_pct: {type: DOUBLE, source: "Short Term Fuel Trim Bank 1[%]"}
      stft_bank2_pct: {type: DOUBLE, source: "Short Term Fuel Trim Bank 2[%]"}
      ltft_bank1_pct: {type: DOUBLE, source: "Long Term Fuel Trim Bank 1[%]"}
      ltft_bank2_pct: {type: DOUBLE, source: "Long Term Fuel Trim Bank 2[%]"}
      # the trip's start (DayNum, 1.0 = 2017-11-01 00:00) plus the time since it started
      row_time:
        type: TIMESTAMP
        sql: >-
          TIMESTAMP '2017-11-01' + to_microseconds(CAST(round((day_num - 1) * 86400e6
          + trip_ms * 1000) AS BIGINT))
    # python src/data_download/fetch_archives.py --dataset ved_signals
    # unpacks into <paths.incoming>/ved_signals/: VED_yymmdd_week.csv and the static data as CSV
    archives:
      dynamic_part1:
        url: https://raw.githubusercontent.com/gsoh/VED/master/Data/VED_DynamicData_Part1.7z
        file: VED_DynamicData_Part1.7z
        kind: 7z
        members: "VED_*_week.csv"
      dynamic_part2:
        url: https://raw.githubusercontent.com/gsoh/VED/master/Data/VED_DynamicData_Part2.7z
        file: VED_DynamicData_Part2.7z
        kind: 7z
        members: "VED_*_week.csv"
      static_ice_hev:
        url: https://raw.githubusercontent.com/gsoh/VED/master/Data/VED_Static_Data_ICE%26HEV.xlsx
        file: VED_Static_Data_ICE&HEV.xlsx
        kind: xlsx
      static_phev_ev:
        url: https://raw.githubusercontent.com/gsoh/VED/master/Data/VED_Static_Data_PHEV%26EV.xlsx
        file: VED_Static_Data_PHEV&EV.xlsx
        kind: xlsx
