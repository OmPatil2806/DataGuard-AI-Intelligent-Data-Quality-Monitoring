# Severity levels and check-category weights.
# Draft values; calibrated in Phase 4 (notebook 04).

severity_levels:
  critical: 4
  high: 3
  medium: 2
  low: 1

# Weight of each check category in the quality score of a month:
#   score = 100 * sum(w_i * pass_rate_i) / sum(w_i)
# Row categories (completeness ... consistency): pass_rate = share of rows that fail no rule of
# the category. Dataset checks (schema, volume, freshness, drift; NULL rate joins completeness):
# pass_rate from check_scores below. ml_anomaly: share of Silver rows the anomaly model did not
# flag. Categories without a result for the month (a skipped check, no trained model) are left
# out of both sums.
category_weights:
  schema: 5
  completeness: 3
  uniqueness: 2
  validity: 3
  pattern: 2
  referential: 2
  consistency: 2
  freshness: 3
  volume: 4
  drift: 3
  ml_anomaly: 1

# Pass rate a dataset check contributes, by its result (the worst result of the check that month).
check_scores:
  pass: 1.0
  low: 0.75
  medium: 0.5
  high: 0.25
  critical: 0.0

# Health label of a month in gold_dataset_health:
#   critical  score below critical_below, or a critical finding
#   warning   score below warning_below, or a high or medium finding
#   healthy   otherwise (low findings alone do not change the label)
# A finding is a failed dataset check or an incident seen that month.
health:
  warning_below: 95
  critical_below: 80
